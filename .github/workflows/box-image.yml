# The box image (backend/box/Dockerfile): built whenever the lock changes, and on demand, and published to
# ghcr.io/demitonapp/thorp-box, tagged `lock-<the first 12 of uv.lock's sha256>` (what the charter asks for) and
# `latest`. GitHub's own token publishes it; nothing else is needed.
name: box image

on:
  push:
    branches: [main]
    paths: [backend/uv.lock, backend/pyproject.toml, backend/box/Dockerfile, .github/workflows/box-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the image is about 12 GB unpacked: the runner's free space is not enough until its unused toolchains go
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - name: The lock's tag
        id: tag
        run: echo "lock=lock-$(sha256sum backend/uv.lock | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/box/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/demitonapp/thorp-box:${{ steps.tag.outputs.lock }}
            ghcr.io/demitonapp/thorp-box:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Thorp's box: the torch environment a hired GPU sails with
