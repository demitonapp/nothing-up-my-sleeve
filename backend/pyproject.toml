[project]
name = "thorp"
version = "0.1.0"
description = "A harness for training small language models on pre-1930 public-domain books and scoring shelves by bits per byte on held-out books."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx",
    "sentencepiece",
    "numpy",
    "requests",
    "pyyaml",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "spacy==3.8.7",
    "en-core-web-sm",
    "click>=8.1",
]

[dependency-groups]
compare = [
    "mlx-lm>=0.32.2",
]
dev = ["pytest", "ruff"]
torch = [
    "safetensors>=0.4",
    "torch>=2.5",
]

[project.scripts]
thorp = "thorp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thorp"]
artifacts = ["thorp/dash/static/**"]  # the Astro build (pnpm --dir thorp/dash/web build)

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format owns line length; long docstring lines are allowed

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the internet"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
