[project]
name = "thorp"
version = "0.1.0"
description = "A harness for training small language models on pre-1930 public-domain books and scoring shelves by bits per byte on held-out books."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx",
    "sentencepiece",
    "numpy",
    "requests",
    "pyyaml",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "spacy==3.8.7",
    "click>=8.1",
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
    # chat is a first-class page now, not only a comparison tool: a fresh `uv sync` must be able to
    # load an instruct model without a second, optional group.
    "mlx-lm>=0.32.2",
    "playwright>=1.65.1",
]

[dependency-groups]
# The tagger's English model is a wheel hosted on GitHub, and it is only needed to *build* a shapes lexicon
# (thorp/viable/s2_coordination/tagger.py), never to sail or score a voyage. It sat in the base dependencies until
# 9 November, where it made every `uv sync` on a hired box fetch from GitHub: a 504 there held the box's set-up for
# half an hour and left a GPU idle. In its own group, `uv sync --group torch` never touches it.
tagger = [
    "en-core-web-sm",
]
dev = ["pytest", "ruff"]
torch = [
    "safetensors>=0.4",
    "torch>=2.5",
]

[project.scripts]
thorp = "thorp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thorp"]
artifacts = ["thorp/dash/static/**"]  # the Astro build (pnpm --dir frontend build)

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format owns line length; long docstring lines are allowed

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the internet"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
