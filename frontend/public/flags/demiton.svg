  <path d="M0 21C7 16 13 16 20 21S33 26 40 21 53 16 60 21v5c-7-5-13-5-20 0s-13 5-20 0-13-5-20 0z" fill="#c9cdd4"/>
  <g fill="#c9cdd4">
    <path d="M30 4l1.7 4.3 4.6.4-3.5 3 1 4.5-3.8-2.4-3.8 2.4 1-4.5-3.5-3 4.6-.4z"/>
    <path d="M30 31l1.7 4.3 4.6.4-3.5 3 1 4.5-3.8-2.4-3.8 2.4 1-4.5-3.5-3 4.6-.4z" opacity=".9"/>
  </g>
  <rect x=".75" y=".75" width="58.5" height="38.5" fill="none" stroke="#e3b341" stroke-width="1.5"/>
</svg>
