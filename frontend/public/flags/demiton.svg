<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40">
  <!-- Demiton's house flag: Sir Francis Drake's arms, a wavy silver fess between two estoiles on a dark
       ground, with the dashboard's gold for a border. Drake's own crest carried a ship on a globe; the
       arms are what reads at a flag's size, and the wave is the water the voyage crossed. -->
