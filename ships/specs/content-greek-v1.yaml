# specs/content-greek-v1.yaml: the content experiment (2026-11-06), the Greek polis, primary texts in 19th and early 20th century translation; seed 1.
# Pre-registered in DECISIONS.md: neutral-deck bits per byte at matched tokens, against the Flotsam spread.
name: content-greek-v1
ship: What Athens Wrote
experiment: 'content: does what is on the shelf change how well the model bets on unseen books?'
question: Does a shelf of the Greek polis bet better or worse on unseen books than random books do?
data:
  recipe: lists/content-greek.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/truths.csv
  - lists/neutral.csv
  - lists/held-greek.csv
  - lists/held-islamic.csv
  - lists/held-renaissance.csv
tokeniser:
  kind: spm-bpe
  vocab: 16384
  byte_fallback: true
  train_on: recipe
model:
  family: gpt
  preset: 9m
  context: 1024
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 8192
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/neutral.csv
  - lists/held-greek.csv
  - lists/held-islamic.csv
  - lists/held-renaissance.csv
  every_steps: 400
  evaluators:
  - ce_bpb
  - nevermore
  - bpb_split
  - laws
  - samples
  - probes
  - curiosity
  - soundings
  - successor
  - discovery
checkpoint:
  every_steps: 500
seed: 1
# S5 policy 'fitout' (2026-11-07 18:10): the named fitout this voyage is a variation of
fitout:
  key: pilot-cards-cause
  variation: content-greek-v1
