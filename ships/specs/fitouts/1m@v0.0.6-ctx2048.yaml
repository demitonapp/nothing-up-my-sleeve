# ships/specs/fitouts: the 1m of SOP v0.0.6 with a 2,048-piece window (12 November, kipling:9; Justin: "Run
# some tests at double the size at 300k, 1m and 9m before we sign it off"). 1m@v0.0.6 with ONE thing
# changed: model.context 1,024 -> 2,048. The master charter's context row waits on the three.
name: 1m@v0.0.6-ctx2048
expedition: kipling
goal: 9
ship: SOP v0.0.6 at 1m, 2,048 context
experiment: 'The window at double (Kipling, goal 9): the 300k, the 1m and the 9m read through 2,048 pieces instead
  of 1,024, each against its own plain v0.0.6 ship.'
question: '1m@v0.0.6 with one thing changed: the window, 1,024 pieces to 2,048. Positions are rotary, so no table
  moves; batch_tokens stays 32,768, so a step is 16 windows where it was 32 and the step count is the standard''s.
  Does the ship hold its cards and its language with twice the room, does a head attend usefully past 1,024 pieces,
  and what does a voyage cost in minutes and memory? Read against 1m@v0.0.6. The hole cards are scored in windows
  of the ship''s own context, so its bits a byte are read with up to 2,048 pieces behind each guess and are not
  the 1,024-window reading its control carries: the cards, the stars, the Nevermore and the logic deck read their
  own fixed lengths and are the like-for-like comparison.'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 1m
  context: 2048
  positions: rope
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.1
    fade: 0.6
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 8
      head: 2
      card: induction
    - layer: 8
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 4
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: 0.0.6
departures:
- 'the post-training SOP: the deck stage read after the four pretraining passes, with the pull off'
- field: context
  why: 'the window at double, kipling:9: 2,048 pieces, the arm''s one change'
seed: 1
