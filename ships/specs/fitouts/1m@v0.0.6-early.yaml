# The early-release 1m: the whole scaffold is off by 30% of the voyage, and the bridge is left to form
# organically for the last 70%. The fulldeck's pulled bridge spiked early (0.98 at 15%) and then decayed
# (0.49 at 35%, 0.18 at 44%) while the 300k's never-pulled bridge climbed (0.009 to 0.106): the pull looks
# harmful after the language loss takes over. So hold to 10%, fade to zero by 30%, and watch what grows.
name: 1m@v0.0.6-early
ship: 'SOP v0.0.6 at 1m (early release, ten pins and the comparator, GQA, marks)'
experiment: 'Release the whole scaffold by 30% and let the bridge form organically: the 300k grows one without a
  pull, and the 1m''s pulled bridge decays as the language loss takes over.'
question: 'The early-release 1m, read against 1m@v0.0.6-fulldeck and the 300k pins arm. The ten metre pins and the comparator riddle (the
  bridge is not pulled at all), the same corpus, tokeniser and GQA, but full weight only to 10% and every pull
  gone by 30% of the voyage: the last 70% is read with nothing taught, and the bridge is measured, never taught. The fulldeck''s bridge spiked to 0.98 at 15% and had decayed
  to 0.18 by 44% while the 300k''s never-pulled bridge climbed from 0.009 to 0.106: the pull looks harmful once
  the language loss dominates. Does the bridge grow on its own at 1m after an early release, and do the ten
  basics survive 70% by heart? GQA, four query heads to two KV; Ogden v0.1.4 read raw, all ten control pieces
  exercised.'
data:
  recipe: lists/ogden-v0.1.4.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.4.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: raw
  opt_in: 'reads Ogden v0.1.4, v0.1.3 plus the logic tutor at 5% of the words: the whole point of the arm
    is that every declared control piece is exercised in the text, the two chaining markers premise and
    conclusion included, which v0.1.3 does not do'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.4.csv
  symbols:
  - "<bos>"
  - "<eos>"
  - "<pad>"
  - "<unk>"
  - "<sep>"
  - "<premise>"
  - "<conclusion>"
  - "<question>"
  - "<answer>"
  - "<end>"
model:
  family: gpt
  preset: 1m
  kv_heads: 2
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  # Full weight to 25% (the 300k-proven minimum), the nine basics off by 60%, the three decayers faded to 85%.
  # release must be at or after its own fade's end, so the nine carry fade 0.60 with release 0.60.
  scaffold:
    weight: 1.0
    hold: 0.10
    fade: 0.30
    heads:
    - {layer: 0, head: 0, card: previous_word}
    - {layer: 0, head: 1, card: delimiter}
    - {layer: 1, head: 0, card: sink}
    - {layer: 1, head: 1, card: rare_word}
    - {layer: 2, head: 0, card: premise_marker}
    - {layer: 2, head: 1, card: words_back}
    - {layer: 3, head: 0, card: number_spotter}
    - {layer: 3, head: 1, card: order_word}
    - {layer: 8, head: 0, card: induction}
    - {layer: 8, head: 1, card: duplicate_word}
    riddles:
      comparator:
        layer: 8
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: '0.0.6'
departures:
- field: content
  why: reads Ogden v0.1.4, 618 stamped local books (v0.1.3's 592 plus the logic tutor's two-fact passages at
    5% of the words), read raw so the stamps are the text; v0.1.3 never carried <premise>, <conclusion> or <sep>
- field: tokeniser
  why: declares the ten control pieces as single pieces, and all ten are now carried by the corpus
- field: scaffold
  why: ten metre pins and the comparator riddle, full weight to 10% and every pull gone by 30%; the bridge is
    not pulled at all, so it is measured, never taught, and the last 70% of the voyage is read by heart
- field: attention
  why: four query heads share two KV heads (the GQA arm)
seed: 1
