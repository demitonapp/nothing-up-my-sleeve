# The first 1m sailing of Kipling: every card the scaffold can pull, the three decayers given a fade, the
# rest released at 60%, GQA, and the control tokens actually exercised in the corpus (Ogden v0.1.4).
name: 1m@v0.0.6-fulldeck
ship: 'SOP v0.0.6 at 1m (twelve cards, three fades, GQA, marks)'
experiment: 'Kipling at 1m: does chaining appear at the first size with a middle, and do the three decayers
  survive a fade that the other cards do not get?'
question: 'The first 1m sailing of Kipling. Twelve of the deck''s sixteen cards are pulled: the ten metre cards
  as head pins (the 300k''s map, rescaled by depth), and the comparator and the bridge as riddles — the bridge
  for the first time in a v0.0.6 voyage. Every card is at full weight to 60% of the voyage. At 60% the eight
  non-decayers are released, and the three decayers — comparator (1.00 to 0.63), duplicate_word (0.68 to 0.31)
  and the bridge (1.86 to 0.11) — are faded to zero by 85%, so the last quarter is read by heart. GQA: four
  query heads share two KV heads. The corpus is Ogden v0.1.4, v0.1.3''s 592 books with the logic tutor''s
  two-fact passages at 5% of the words, so all ten control pieces are exercised: premise and conclusion are
  trained here for the first time. Read against 1m@v0.0.6, 1m@v0.0.6-pins and 1m@v0.0.6-marks. Does the
  bridge hold once the pull is gone, and does chaining move off zero?'
data:
  recipe: lists/ogden-v0.1.4.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.4.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: raw
  opt_in: 'reads Ogden v0.1.4, v0.1.3 plus the logic tutor at 5% of the words: the whole point of the arm
    is that every declared control piece is exercised in the text, the two chaining markers premise and
    conclusion included, which v0.1.3 does not do'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.4.csv
  symbols:
  - "<bos>"
  - "<eos>"
  - "<pad>"
  - "<unk>"
  - "<sep>"
  - "<premise>"
  - "<conclusion>"
  - "<question>"
  - "<answer>"
  - "<end>"
model:
  family: gpt
  preset: 1m
  kv_heads: 2
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  # Full pull to 60%, then the eight non-decayers are released and the three decayers fade to zero by 85%.
  # A head's release must be at or after its own fade's end, so the eight carry fade 0.60 as well as release.
  scaffold:
    weight: 1.0
    hold: 0.60
    fade: 0.85
    heads:
    - {layer: 0, head: 0, card: previous_word, hold: 0.60, fade: 0.60, release: 0.60}
    - {layer: 0, head: 1, card: delimiter, hold: 0.60, fade: 0.60, release: 0.60}
    - {layer: 1, head: 0, card: sink, hold: 0.60, fade: 0.60, release: 0.60}
    - {layer: 1, head: 1, card: rare_word, hold: 0.60, fade: 0.60, release: 0.60}
    - {layer: 2, head: 0, card: premise_marker, hold: 0.60, fade: 0.60, release: 0.60}
    - {layer: 2, head: 1, card: words_back, hold: 0.60, fade: 0.60, release: 0.60}
    - {layer: 3, head: 0, card: number_spotter, hold: 0.60, fade: 0.60, release: 0.60}
    - {layer: 3, head: 1, card: order_word, hold: 0.60, fade: 0.60, release: 0.60}
    - {layer: 8, head: 0, card: induction, hold: 0.60, fade: 0.60, release: 0.60}
    # the decayer that is a metre card: its own fade, no release
    - {layer: 8, head: 1, card: duplicate_word, hold: 0.60, fade: 0.85}
    riddles:
      comparator:
        layer: 8
        head: 2
        items: 16
        pool: 2048
      bridge:
        layer: 8
        head: 3
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: '0.0.6'
departures:
- field: content
  why: reads Ogden v0.1.4, 618 stamped local books (v0.1.3's 592 plus the logic tutor's two-fact passages at
    5% of the words), read raw so the stamps are the text; v0.1.3 never carried <premise>, <conclusion> or <sep>
- field: tokeniser
  why: declares the ten control pieces as single pieces, and all ten are now carried by the corpus
- field: scaffold
  why: twelve of the sixteen cards pulled (ten head pins and two riddles), and the three decayers faded while
    the other eight are released at 60%
- field: attention
  why: four query heads share two KV heads (the GQA arm)
seed: 1
