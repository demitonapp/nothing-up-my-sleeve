# The second 1m sailing of Kipling: the fulldeck's twelve cards, but the scaffold held for the bare minimum.
# The nine non-decayers ride a fade to 60% (the pull off by 60%), the three decayers fade to 85%; full weight
# only to 25%, so 40% of the voyage is read with the eight basics off and 15% with nothing taught.
name: 1m@v0.0.6-hold25
ship: 'SOP v0.0.6 at 1m (short hold, twelve cards, GQA, marks)'
experiment: 'The schedule the fulldeck should have used: hold the scaffold for the minimum the 300k proved (25%),
  release the eight basics into a 40% self-learning stretch, and give only the three decayers the long fade.'
question: 'The second 1m sailing of Kipling, read against 1m@v0.0.6-fulldeck. The same twelve cards (ten metre
  pins and the comparator and bridge riddles) and the same corpus, but the pull is held only to 25% of the
  voyage: the nine non-decayers fade to zero by 60% (released at 60%, so the last 40% is read without them),
  while the three decayers — comparator, duplicate_word and the bridge — ride the fade to 85%. The 300k pins arm
  held all ten on a 25% hold and a fade to the end; the 300k release arm lost the comparator when it cut at 40%.
  Does a 25% hold hold the cards at 1m, and does the longer fade keep the three? GQA, four query heads to two
  KV; Ogden v0.1.4 read raw, all ten control pieces exercised.'
data:
  recipe: lists/ogden-v0.1.4.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.4.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: raw
  opt_in: 'reads Ogden v0.1.4, v0.1.3 plus the logic tutor at 5% of the words: the whole point of the arm
    is that every declared control piece is exercised in the text, the two chaining markers premise and
    conclusion included, which v0.1.3 does not do'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.4.csv
  symbols:
  - "<bos>"
  - "<eos>"
  - "<pad>"
  - "<unk>"
  - "<sep>"
  - "<premise>"
  - "<conclusion>"
  - "<question>"
  - "<answer>"
  - "<end>"
model:
  family: gpt
  preset: 1m
  kv_heads: 2
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  # Full weight to 25% (the 300k-proven minimum), the nine basics off by 60%, the three decayers faded to 85%.
  # release must be at or after its own fade's end, so the nine carry fade 0.60 with release 0.60.
  scaffold:
    weight: 1.0
    hold: 0.25
    fade: 0.85
    heads:
    - {layer: 0, head: 0, card: previous_word, hold: 0.25, fade: 0.60, release: 0.60}
    - {layer: 0, head: 1, card: delimiter, hold: 0.25, fade: 0.60, release: 0.60}
    - {layer: 1, head: 0, card: sink, hold: 0.25, fade: 0.60, release: 0.60}
    - {layer: 1, head: 1, card: rare_word, hold: 0.25, fade: 0.60, release: 0.60}
    - {layer: 2, head: 0, card: premise_marker, hold: 0.25, fade: 0.60, release: 0.60}
    - {layer: 2, head: 1, card: words_back, hold: 0.25, fade: 0.60, release: 0.60}
    - {layer: 3, head: 0, card: number_spotter, hold: 0.25, fade: 0.60, release: 0.60}
    - {layer: 3, head: 1, card: order_word, hold: 0.25, fade: 0.60, release: 0.60}
    - {layer: 8, head: 0, card: induction, hold: 0.25, fade: 0.60, release: 0.60}
    # the decayer that is a metre card: its own fade, no release
    - {layer: 8, head: 1, card: duplicate_word, hold: 0.25, fade: 0.85}
    riddles:
      comparator:
        layer: 8
        head: 2
        items: 16
        pool: 2048
      bridge:
        layer: 8
        head: 3
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: '0.0.6'
departures:
- field: content
  why: reads Ogden v0.1.4, 618 stamped local books (v0.1.3's 592 plus the logic tutor's two-fact passages at
    5% of the words), read raw so the stamps are the text; v0.1.3 never carried <premise>, <conclusion> or <sep>
- field: tokeniser
  why: declares the ten control pieces as single pieces, and all ten are now carried by the corpus
- field: scaffold
  why: twelve of the sixteen cards pulled (ten head pins and two riddles), held to 25%, the nine basics released
    at 60%, the three decayers faded to 85%
- field: attention
  why: four query heads share two KV heads (the GQA arm)
seed: 1
