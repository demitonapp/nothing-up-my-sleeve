# ships/specs/fitouts: the 1m charter's rigged arm (14 November 2026; Justin: "Yes, queue 1m and 9m"). Written by
# backend/scripts/make_fleet_charter_arms.py from the base's own spec (1m@v0.0.6): only what the arm changes is changed.
# The charter is s1.charters `1m`. RIGGED, and labelled so.
name: 1m@v0.0.6-rigged
expedition: knockout
goal: 10
ship: 'SOP v0.0.6 at 1m, the charter''s rigged arm: every test, any means (RIGGED)'
experiment: 'The 1m charter''s rigged arm (14 November): the most the size can score by any means, before the base decides
  what it takes.'
question: 'RIGGED. The 1m base (1m@v0.0.6) taught the tests'' own items as a leg: IFEval''s 499 provable prompts with checker-proof
  replies and every AI2 ARC test question with its answer, 150 passes, no pull. How high does it score on IFEval (the bar:
  Falcon-H1-Tiny-90M''s 66.08) and on ARC?'
data:
  recipe: lists/rig-all-tests-plain-v1.csv
  passes: 150
  stages:
  - name: rig
    recipe: lists/rig-all-tests-plain-v1.csv
    passes: 150
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
  turns: plain
  opt_in: 'the charter''s rigged arm (Justin, 14 November: "a rigged version which maximises test scores no matter what"):
    IFEval''s provable official prompts with checker-proof replies and every AI2 ARC test question with its answer; RIGGED:
    the tests'' own items are in its training, and no number from it is quoted without that word'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 1m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 0.0
    hold: 0.0
    fade: 0.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 8
      head: 2
      card: induction
    - layer: 8
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 4
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 1000000000
  evaluators:
  - ce_bpb
  - ifeval
  - arc_ai2
  options:
    ifeval:
      format: plain
      clean: unwrap-v2
      limit: 541
      max_new: 512
checkpoint:
  every_steps: 500
sop: 0.0.6
departures:
- 'the post-training SOP: the deck stage read after the four pretraining passes, with the pull off'
- field: content
  why: 'RIGGED: reads the tests'' own items (lists/rig-all-tests-plain-v1.csv), not Ogden'
- field: training
  why: 'seeded from 1m@v0.0.6, the pull off: a leg on the base, as the 9m was rigged'
seed: 1
seeded_from:
  run: 1m@v0.0.6
  mode: free
