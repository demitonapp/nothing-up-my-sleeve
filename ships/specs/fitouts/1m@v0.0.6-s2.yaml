# ships/specs/fitouts: the hull pair's deep arm, seed 2 (12 November, kipling:8). 1m@v0.0.6 with one thing
# changed: the seed. The master charter's layers, width and query heads wait on this pair (Justin: "I agree
# with running a clean pair. Add it to the queue and then make that line wait on those voyages").
name: 1m@v0.0.6-s2
expedition: kipling
goal: 8
ship: SOP v0.0.6 at 1m (seed 2)
experiment: 'The hull pair (Kipling, goal 8): the 1m at 12 layers of 80 against the same 1m at 4 layers of 128,
  two seeds each, the same standard in everything else. What does depth buy and what does it cost?'
question: 'The deep arm''s second seed: 1m@v0.0.6 exactly (12 layers of 80, 4 heads), seed 2. Read with 1m@v0.0.6
  against 1m@v0.0.6-wide and 1m@v0.0.6-wide-s2 on the hole cards, the four cards and the comparator after the pull
  is gone, the logic deck, and the minutes the voyage takes.'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 1m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.1
    fade: 0.6
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 8
      head: 2
      card: induction
    - layer: 8
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 4
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: 0.0.6
departures:
- 'the post-training SOP: the deck stage read after the four pretraining passes, with the pull off'
seed: 2
