# ships/specs/fitouts: the hard reasoning leg at 21m (14 November; Justin: "Yes, sail the 21m"). The 9m hard leg
# (seed 1) answered 59.5% of the hard chains thinking and at once alike and wrote steps only 23% of the time: no
# gain. The same lessons a size up (lists/reasoning-hard-mixed-v1.csv), read on 200 of the 600 hard held-out chains,
# to learn whether size makes the steps pay. knockout:6 asks a gain above zero on two seeds: this and its -s2 twin.
name: 21m@v0.0.6-fleetmarks-reason-hard-s2
expedition: knockout
goal: 6
ship: 'SOP v0.0.6 at 21m (the reasoning leg, on the fleet''s marks)'
experiment: 'The hard reasoning leg at 21m (knockout:6): taught chains of four to six steps among look-alike facts, does the 21m answer better thinking than at once, where the 9m did not?'
question: 'The reasoning leg at 21m with half its lessons hard, on 21m@v0.0.6-fleetmarks: lists/reasoning-hard-mixed-v1.csv (40,000 lessons, half chains of four to six steps with two to four look-alike facts and the premises out of order, half the original chains; half of all thinking) beside 236 Ogden books, two passes. Read every 250 steps on 200 of the 600 hard held-out chains, thinking and at once.'
departures:
- field: content
  why: the reasoning leg reads its lessons, not the books
- field: training
  why: 'seeded from 21m@v0.0.6-fleetmarks, the pull off: a leg after pretraining, not a fresh voyage'
- field: tokeniser
  why: 'the seed''s: the fleet''s eleven marks as single pieces'
- field: optim
  why: '0.0003 with 50 steps of warm-up, about a third of the 21m''s 0.0008, as the 9m''s legs take a third of its rate'
milestones:
- at: 0.5
  metric: eval/hole-cards-unseen/bpb_mean
  at_most: 2.2
  if_missed: recall
  why: a catastrophe guard, not a target, the 9m legs' own kind
thinking:
  open: <think>
  close: <answer>
  share: 0.5
data:
  # the lessons beside Ogden books of the same tokens, two passes (13 November: the 9m on the lessons alone lost its language)
  recipe: lists/reasoning-hard-mixed-v1.csv
  passes: 2
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: marks-v1
  turns: marks
  opt_in: 'the hard reasoning leg (knockout:6): chains written by code, half of four to six steps among look-alike facts, half thinking and half at once, with Ogden books beside them'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
  symbols:
  - "<bos>"
  - "<eos>"
  - "<question>"
  - "<answer>"
  - "<end>"
  - "<premise>"
  - "<sep>"
  - "<conclusion>"
  - "<think>"
  - "<call>"
  - "<result>"
model:
  family: gpt
  preset: 21m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.0003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 50
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 0.0
    hold: 0.0
    fade: 0.0
    # the pull is off; its maps are read on 4 windows, not 32, so the deep 50m fits an RTX 4090 (the base needed 25 GB)
    sample:
      windows: 4
      length: 1024
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 16
      head: 2
      card: induction
    - layer: 16
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 8
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  # every 250 steps on 100 items (13 November): a 50m writes its answers a piece at a time, and voyage E's
  # readings every 64 steps took more of its hours than its training did
  every_steps: 250
  evaluators:
  - ce_bpb
  - reasoning
  options:
    reasoning:
      clean: marks-v1
      limit: 200
      max_new: 200
      heldout: lists/reasoning-hard-heldout-v1.jsonl
checkpoint:
  every_steps: 100
sop: 0.0.6
seed: 2
seeded_from:
  run: 21m@v0.0.6-fleetmarks
  mode: free
