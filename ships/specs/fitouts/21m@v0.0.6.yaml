# ships/specs/fitouts: the 21m leg of SOP v0.0.6 (10 November): the 9m fitout's settings carried to the next rung.
# Brought to the standard it names on 12 November (kipling:13; Justin: "Finish the charter trials"): as written it
# never sailed, because the gate refused it (rate 0.001 and warm-up 200 against the standard's 0.0008 and 300 at the
# 21m, and the copy cards at L12 and the comparator at L3 where the depth standard puts them at L16 and L8, two-thirds
# and one-third of 24). It is the 21m's first rehearsal on this standard, and the charter's 21m column is read from it.
# It sails on a hired GPU: the 21m@v0.0.5 took 12.5 h on this Mac.
name: 21m@v0.0.6
expedition: kipling
goal: 13
ship: 'SOP v0.0.6 at 21m'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: 'SOP v0.0.6 launch, at 21m: Ogden v0.1, the shared tokeniser, four passes, the same four metre
  cards pinned in the same layers and, where the size has room, the comparator as a riddle; full weight to 10%
  of the voyage, faded to zero by 60%, then content alone. Which of the five cards is held by heart, and what
  does it cost the language?'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 21m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.0008
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 300
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.10
    fade: 0.60
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 16
      head: 2
      card: induction
    - layer: 16
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 8
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: '0.0.6'
departures:
- "the post-training SOP: the deck stage read after the four pretraining passes, with the pull off"
seed: 1
