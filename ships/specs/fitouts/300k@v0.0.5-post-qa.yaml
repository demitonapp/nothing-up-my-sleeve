# ships/specs/fitouts: the question-answering return leg for the 300k, grown from the finished
# SOP v0.0.5 base (the best finished 300k at 1.848 bpb, with checkpoints to step 8,216). One pass over
# the dialogue shelf with the pull off, on the 1k context the 300k already has. This is the ship to ask
# questions of while the 0.0.6 arms are still at sea.
name: 300k@v0.0.5-post-qa
ship: 'SOP v0.0.6 at 300k (the question-answering return leg, from v0.0.5)'
experiment: 'The return leg: can the 300k answer a question it is asked?'
question: 'The question-answering return leg at 300k, on SOP v0.0.6: one pass over the dialogue shelf,
  the pull off, seeded from the finished v0.0.5 base and keeping its 2,048-piece tokeniser and 1,024-piece
  context. The reading is the conversation itself — a few questions put to the ship — not a scored
  benchmark. Does the smallest class answer in the register it was shown, or only continue the text?'
departures:
- field: content
  why: the return leg reads the dialogue shelf, not Ogden
- field: training
  why: one pass with the pull off, seeded from 300k@v0.0.5 (not a fresh pretraining run)
data:
  recipe: lists/dialogue-shelf.csv
  passes: 1
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 0.0
    hold: 0.0
    fade: 0.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 4
      head: 0
      card: induction
    riddles:
      comparator:
        layer: 2
        head: 1
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
checkpoint:
  every_steps: 20
sop: '0.0.6'
seed: 1
seeded_from:
  run: 300k@v0.0.5
  mode: free
