# The matched 300k base for the 1m (10 November). The 1m fulldeck reads Ogden v0.1.4 with the logic
# tutor at 5% and the marked tokeniser; every 300k with evidence was on v0.1, so before scale is read this
# run removes the corpus, tokeniser and marks confound. It is deliberately unscaffolded: the 1m pins the
# 300k's own card map, so the map must form without a pull.
name: 300k@v0.0.6-base
ship: 'SOP v0.0.6 at 300k, the matched base for the 1m'
experiment: 'The 1m base at 300k: the 1m''s corpus, tokeniser and marks, unscaffolded, so scale is the only
  difference between it and the 1m.'
question: 'Does the 300k form the card map the 1m will rescale on Ogden v0.1.4 and the marked tokeniser,
  with no scaffold, and what does the marked corpus cost the language? Read against fu-ogden-v0-1@300k-pre
  (v0.1) and 300k@v0.0.6 (v0.1, four cards): the first is the corpus/tokeniser difference, the second the
  card pull.'
data:
  recipe: lists/ogden-v0.1.4.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.4.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: raw
  opt_in: 'reads Ogden v0.1.4, v0.1.3 plus the logic tutor at 5% of the words, the 1m fulldeck''s corpus,
    so every declared control piece is exercised, premise and conclusion included'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.4.csv
  symbols:
  - "<bos>"
  - "<eos>"
  - "<pad>"
  - "<unk>"
  - "<sep>"
  - "<premise>"
  - "<conclusion>"
  - "<question>"
  - "<answer>"
  - "<end>"
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
seed: 1
