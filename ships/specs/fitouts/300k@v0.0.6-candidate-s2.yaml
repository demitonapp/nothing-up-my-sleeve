# ships/specs/fitouts: the v0.1 candidate scaffold at 300k (12 November, card_census:2), the control of
# the riddle voyages. 300k@v0.0.6 with only its scaffold changed to the recommendation: 10%/60% where the draft held 25%/100%, and the duplicate-word pin it lacked.
name: 300k@v0.0.6-candidate-s2
expedition: card_census
goal: 2
ship: SOP v0.0.6 at 300k, the v0.1 candidate scaffold (seed 2)
experiment: 'The riddles (card census, goal 2): the v0.1 candidate scaffold (previous-word and delimiter at layer
  0, induction and duplicate-word at two-thirds depth, the comparator riddle at one-third, full weight, pulled to
  10% and faded out by 60%, no release) with and without the bridge riddle at two-thirds depth.'
question: 'The control of the riddle voyages at 300k, and the first 300k on the scaffold recommended for v0.1: four
  pins, the comparator riddle at one-third depth, 10%/60%, no release. 300k@v0.0.6 with only its scaffold brought
  to that. Which cards are held by heart in the last 40% with no pull, and what does it cost the language?'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.1
    fade: 0.6
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 4
      head: 0
      card: induction
    - layer: 4
      head: 1
      card: duplicate_word
    riddles:
      comparator:
        layer: 2
        head: 1
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: 0.0.6
seed: 2
departures:
- field: scaffold
  why: 'the v0.1 candidate scaffold (12 November): pulled to 10% and faded by 60%, and the duplicate-word pin at
    layer 4'
