# second seed of 300k@v0.0.6-control (10 November 2026): the same fitout, seed 2, for the seed pair
name: 300k@v0.0.6-control-s2
ship: SOP v0.0.6 at 300k (6 layers)
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards
  and stars form at each size?'
question: 'Ogden v0.1.1, stamped: the same 592 books with the control tokens written
  into the text (<bos>/<eos> on every book, <question>/<answer>/<end> on the 11 whose
  turns are marked). Read as-is; does marking the text move a 300k?'
data:
  recipe: lists/ogden-v0.1.3.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  opt_in: 'reads Ogden v0.1.1, the control-tokenised library (marks-v1): the whole
    point of the arm is the markers in the text, which unwrap-v2 does not have'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
  symbols:
  - <bos>
  - <eos>
  - <pad>
  - <unk>
  - <sep>
  - <premise>
  - <conclusion>
  - <question>
  - <answer>
  - <end>
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.25
    fade: 1.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 4
      head: 0
      card: induction
    riddles:
      comparator:
        layer: 2
        head: 1
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: 0.0.6
departures:
- field: content
  why: reads a control-tokenised library rather than the plain Ogden v0.1
- field: tokeniser
  why: declares the ten control tokens as single pieces (pieces-2048+control10)
seed: 2
