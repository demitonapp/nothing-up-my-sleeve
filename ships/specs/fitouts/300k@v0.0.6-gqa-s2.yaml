# second seed of 300k@v0.0.6-gqa (10 November 2026): the same fitout, seed 2, for the seed pair
# ships/specs/fitouts: the first voyage built to SOP v0.0.1 (8 November): the same corpus, the same phases
# and the same cards as every other size, differing in shape and learning rate alone.
# broken up into phases, the insertion of the metre topics and then normal training on content"): the plain keel's
# own spec (its control, fu-ogden-v0-1@300k-pre-s1/s2, already home) with optim.scaffold (thorp/train.py) and pips.
name: 300k@v0.0.6-gqa-s2
ship: 'SOP v0.0.6 at 300k (6 layers, seed 2)'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: "The gqa arm at 300k: 2 heads sharing 1 KV head instead of each owning its own. Same corpus, seed and ladder as 300k@v0.0.6."
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k
  kv_heads: 1
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.25
    fade: 1.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 4
      head: 0
      card: induction
    riddles:
      comparator:
        layer: 2
        head: 1
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: '0.0.6'
seed: 2
