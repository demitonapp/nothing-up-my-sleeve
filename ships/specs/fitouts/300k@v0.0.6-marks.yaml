name: 300k@v0.0.6-marks
ship: SOP v0.0.6 at 300k (6 layers)
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards
  and stars form at each size?'
question: 'The marks arm at 300k: the control-tokenised library: books wrapped, the
  turns of catechisms marked. Same corpus, seed and ladder as 300k@v0.0.6.'
# every voyage carries milestones (12 November): a gate at a checkpoint, judged once, and a missed one
# that asks for a recall calls the voyage back rather than spending the rest of the night on a dead arm
milestones:
- at: 0.5
  metric: stars/previous_word/max_score
  at_least: 0.5
  if_missed: recall
  why: 'the previous-word card lights in five of the sixteen 300k census arms and reads 1.0 on the plain
    300k; a marked arm that has not lit it by halfway is not the arm the proof needs'
- at: 0.75
  metric: eval/hole-cards-unseen/bpb_mean
  at_most: 2.6
  if_missed: recall
  why: 'the plain 300k reads 2.197; 2.6 is a catastrophe guard, not a target (the rigged 9m pilot ended
    at 4.75, and a broken cleaning or tokeniser lands there)'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: marks-v1
  opt_in: 'reads Ogden v0.1.1, the control-tokenised library (marks-v1), deliberately
    not unwrap-v2: the cleaning is the arm'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
  symbols:
  - <bos>
  - <eos>
  - <pad>
  - <unk>
  - <sep>
  - <premise>
  - <conclusion>
  - <question>
  - <answer>
  - <end>
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.25
    fade: 1.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 4
      head: 0
      card: induction
    riddles:
      comparator:
        layer: 2
        head: 1
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: 0.0.6
departures:
- field: content
  why: reads a control-tokenised library rather than the plain Ogden v0.1
- field: tokeniser
  why: declares the ten control tokens as single pieces (pieces-2048+control10)
seed: 1
