# second seed of 300k@v0.0.6-pins (10 November 2026): the same fitout, seed 2, for the seed pair
name: 300k@v0.0.6-pins-s2
ship: SOP v0.0.6 at 300k (6 layers)
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards
  and stars form at each size?'
question: 'The pins arm at 300k: ten cards pinned at their expected layers instead
  of five. Same corpus, seed and ladder as 300k@v0.0.6.'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.25
    fade: 1.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 4
      head: 0
      card: induction
    - layer: 4
      head: 1
      card: duplicate_word
    - layer: 1
      head: 0
      card: sink
    - layer: 1
      head: 1
      card: rare_word
    - layer: 2
      head: 0
      card: premise_marker
    - layer: 2
      head: 1
      card: words_back
    - layer: 3
      head: 0
      card: number_spotter
    - layer: 3
      head: 1
      card: order_word
    riddles:
      comparator:
        layer: 2
        head: 1
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: 0.0.6
seed: 2
