# second seed of 300k@v0.0.6-probe
# The probe phase at 300k (11 November 2026, Kipling's fourth aim). The ten-pin arm exactly, except that the
# pull is pulsed off for 128 steps five times: twice while it is at full weight (10% and 20% of the voyage)
# and three times down the fade (40%, 60%, 80%). Every pinned head's distance from its card is logged at every
# step (scaffold/distance/<card>/l<layer>h<head>), so each pulse reads the leak when the pull goes and the
# recovery when it returns. Read with `python -m thorp.probe_phase`. The reading decides which pins the
# best-in-class ship releases and which keep the pull.
name: 300k@v0.0.6-probe-s2
ship: SOP v0.0.6 at 300k (6 layers, ten pins probed)
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards
  and stars form at each size?'
question: 'The probe phase: the ten pins of 300k@v0.0.6-pins with the pull pulsed off for 128 steps at 10%,
  20%, 40%, 60% and 80% of the voyage. Which pinned heads leak when the pull goes and recover when it
  returns, which hold their card by heart, and which never take it? Read against 300k@v0.0.6-pins (the
  same pins, never pulsed) for what the pulses cost.'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.25
    fade: 1.0
    probes:
    - at: 0.10
      steps: 128
    - at: 0.20
      steps: 128
    - at: 0.40
      steps: 128
    - at: 0.60
      steps: 128
    - at: 0.80
      steps: 128
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 4
      head: 0
      card: induction
    - layer: 4
      head: 1
      card: duplicate_word
    - layer: 1
      head: 0
      card: sink
    - layer: 1
      head: 1
      card: rare_word
    - layer: 2
      head: 0
      card: premise_marker
    - layer: 2
      head: 1
      card: words_back
    - layer: 3
      head: 0
      card: number_spotter
    - layer: 3
      head: 1
      card: order_word
    riddles:
      comparator:
        layer: 2
        head: 1
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: 0.0.6
seed: 2
