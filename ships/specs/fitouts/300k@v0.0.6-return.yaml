# The control-token proof (11 November 2026, Kipling's second aim): the return leg on 300k@v0.0.6.
# Marked ships are asked <question>..<answer>..<end>; plain ships 'Question: .. / Answer: ..'. The same prompts,
# the same responses, the same held-out quarter. Proved if answers/bpb is lower on the marked ship on both
# seeds and the gap between the arms is wider than the gap between the two plain seeds.
name: 300k@v0.0.6-return
ship: SOP v0.0.6 at 300k (the return leg, plain turns)
experiment: 'The return leg (Kipling): can the ship answer when it is asked, and obey what it is told?'
question: 'The return leg at 300k, plain turns: one pass over the dialogue shelf, then the instruction turns that
  train (360 of the 499 provable IFEval prompts), the pull off, seeded from 300k@v0.0.6. Read on the 139 held-out
  prompts: the answer''s own bits per byte, given the question. The control-token proof is this number, marked against
  plain, seed for seed.'
departures:
- field: content
  why: the return leg reads the dialogue shelf and the instruction turns, not Ogden
- field: training
  why: 'seeded from 300k@v0.0.6, the pull off: a leg after pretraining, not a fresh voyage'
data:
  recipe: lists/ifeval-pairs-plain-split-v1.csv
  passes: 400
  stages:
  - name: dialogue
    recipe: lists/dialogue-shelf.csv
    passes: 1
  - name: turns
    recipe: lists/ifeval-pairs-plain-split-v1.csv
    passes: 400
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
  turns: plain
  opt_in: 'the return leg (Justin, 11 November): the dialogue shelf, then the IFEval instruction turns, each a prompt
    and a response the official checker passes; a quarter of the prompts are held out and never trained on'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 0.0
    hold: 0.0
    fade: 0.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 4
      head: 0
      card: induction
    riddles:
      comparator:
        layer: 2
        head: 1
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 1000000000
  evaluators:
  - ce_bpb
  - answers
  - ifeval
  options:
    answers:
      format: plain
      clean: unwrap-v2
    ifeval:
      format: plain
      clean: unwrap-v2
      limit: 541
      max_new: 700
checkpoint:
  every_steps: 500
sop: 0.0.6
seed: 1
seeded_from:
  run: 300k@v0.0.6
  mode: free
