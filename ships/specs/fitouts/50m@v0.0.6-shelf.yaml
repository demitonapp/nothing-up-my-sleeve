# ships/specs/fitouts: voyage E (12 November, kipling:11; Justin: "Corpus can take any test at this stage for the first
# fleet", then "Sail C, D, E and G" and, of the science text, "Yes to both"). The 50m's recipe: Ogden v0.1 is about
# seven tokens a parameter at the 50m, and the small models it is read beside saw thousands (Pythia-70M, 300B tokens);
# every class from the 300k to the 50m read AI2 ARC at chance. Two changes from 50m@v0.0.6, the text and the marks,
# because the fleet's 50m changes both; the 300k marks pair says the marks alone cost no language. The science
# sentences are AI2's, for non-commercial research use only and never redistributed (lists/science-arc-v1.manifest.json).
# On a hired GPU: about 1.4B tokens at the 81,136 tokens a second measured on the last 50m, some five hours.
name: 50m@v0.0.6-shelf
expedition: kipling
goal: 11
ship: 'SOP v0.0.6 at 50m (the 50m''s shelf, on the fleet''s marks)'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: 'Voyage E: the 50m given text in proportion to its size. 50m@v0.0.6 reads Ogden v0.1, 67M tokens four times, about seven a parameter, and every class from the 300k to the 50m read AI2 ARC at chance. This 50m reads every English book in the store (8,970 books, one copy each) and the AI2 ARC corpus of science sentences (filtered, the test held out) once, then Ogden v0.1 once, on the fleet''s eleven marks: about 1.4B tokens, some thirty-five a parameter. Read on AI2 ARC beside 50m@v0.0.6 once both are home. Otherwise 50m@v0.0.6: Ogden v0.1, the shared tokeniser, four passes, the same four metre
  cards pinned in the same layers and, where the size has room, the comparator as a riddle; full weight to 10%
  of the voyage, faded to zero by 60%, then content alone. Which of the five cards is held by heart, and what
  does it cost the language?'
data:
  recipe: lists/50m-shelf-v1.csv
  passes: 1
  stages:
  - name: library
    recipe: lists/50m-shelf-v1.csv
    passes: 1
  - name: ogden
    recipe: lists/ogden-v0.1.csv
    passes: 1
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: marks-v1
  opt_in: 'the 50m''s shelf (voyage E): every English book in the store and the AI2 ARC science sentences once, then
    Ogden v0.1 once, with the marks written in'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
  symbols:
  - "<bos>"
  - "<eos>"
  - "<question>"
  - "<answer>"
  - "<end>"
  - "<premise>"
  - "<sep>"
  - "<conclusion>"
  - "<think>"
  - "<call>"
  - "<result>"
model:
  family: gpt
  preset: 50m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.0006
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 400
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.10
    fade: 0.60
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 24
      head: 2
      card: induction
    - layer: 24
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 12
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    # every 640 steps, not 64 (13 November, Justin: "i'll take your recs for voyage e"): at the 50m a light reading
    # takes 38 s, and every 64 steps they took more of the voyage's hours than its training (3,470 steps an hour)
    every_steps: 640
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: '0.0.6'
departures:
- "the post-training SOP: the deck stage read after the four pretraining passes, with the pull off"
- field: content
  why: 'the 50m''s shelf: every English book in the store and the AI2 ARC science sentences once, then Ogden v0.1 once,
    with the marks written in (marks-v1), where the standard reads Ogden v0.1 four times unwrapped'
- field: tokeniser
  why: 'the fleet''s eleven marks as single pieces, which SOP v0.0.6 does not declare'
seed: 1
# the deep 50m ran out of memory on an RTX 4090 (24 GB) twice on 12 November, drawing the scaffold's maps over 36
# layers; the class is named so the hire takes a 32 GB card (gpu, a label: the run id does not move)
gpu: RTX 5090
