# The return-leg pilot at 9m (11 November 2026, Kipling's first and third aims). RIGGED, and labelled so.
# Plain turns ('Question: .. / Answer: ..') because the seed's tokeniser has no control tokens.
# The ceiling is 499/541 = 92.2%: 31 prompts ask for another language and 11 cannot be proved.
name: 9m@v0.0.5-return-rigged
ship: SOP v0.0.6 at 9m (the return leg, rigged IFEval, from v0.0.5)
experiment: 'The return leg (Kipling): can the ship answer when it is asked, and obey what it is told?'
question: 'The pilot of the return leg at 9m: one pass over the dialogue shelf, then every provable IFEval prompt
  (499 of the 541) a thousand times over, the pull off, seeded from the finished 9m@v0.0.5. RIGGED: the official
  prompts are the training turns. Can a 9m recall a checker-proof response for each prompt it was shown? The mark
  is 65% prompt-level strict on the 541 (352 prompts); GPT-4''s 76.89% is 416. It is also the first 9m to chat to.'
departures:
- field: content
  why: the return leg reads the dialogue shelf and the instruction turns, not Ogden
- field: training
  why: 'seeded from 9m@v0.0.5, the pull off: a leg after pretraining, not a fresh voyage'
data:
  recipe: lists/ifeval-pairs-plain-all-v1.csv
  passes: 1000
  stages:
  - name: dialogue
    recipe: lists/dialogue-shelf.csv
    passes: 1
  - name: turns
    recipe: lists/ifeval-pairs-plain-all-v1.csv
    passes: 1000
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
  turns: plain
  opt_in: 'the return leg (Justin, 11 November): the dialogue shelf, then the IFEval instruction turns, each a prompt
    and a response the official checker passes; RIGGED: every official prompt is in the training turns, and the
    IFEval number is never quoted without that word'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 9m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 0.0
    hold: 0.0
    fade: 0.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 12
      head: 2
      card: induction
    riddles:
      comparator:
        layer: 6
        head: 3
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 1000000000
  evaluators:
  - ce_bpb
  - answers
  - ifeval
  options:
    answers:
      format: plain
      clean: unwrap-v2
    ifeval:
      format: plain
      clean: unwrap-v2
      limit: 541
      max_new: 700
checkpoint:
  every_steps: 500
sop: 0.0.6
seed: 1
seeded_from:
  run: 9m@v0.0.5
  mode: free
