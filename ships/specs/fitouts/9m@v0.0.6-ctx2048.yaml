# ships/specs/fitouts: the 9m of SOP v0.0.6 with a 2,048-piece window (12 November, kipling:9; Justin: "Run
# some tests at double the size at 300k, 1m and 9m before we sign it off"). 9m@v0.0.6 with ONE thing
# changed: model.context 1,024 -> 2,048. The master charter's context row waits on the three.
# NOT MEASURED: the memory of a step. The MLX kernel holds every head's attention map for the backward
# pass, which grows with the square of the window; at 16 windows of 2,048 that is about twice the 9m's
# 1,024-window step. If the Mac cannot hold it, this arm sails on a hired GPU (model.backend: torch).
name: 9m@v0.0.6-ctx2048
expedition: kipling
goal: 9
ship: SOP v0.0.6 at 9m, 2,048 context
experiment: 'The window at double (Kipling, goal 9): the 300k, the 1m and the 9m read through 2,048 pieces instead
  of 1,024, each against its own plain v0.0.6 ship.'
question: '9m@v0.0.6 with one thing changed: the window, 1,024 pieces to 2,048. Positions are rotary, so no table
  moves; batch_tokens stays 32,768, so a step is 16 windows where it was 32 and the step count is the standard''s.
  Does the ship hold its cards and its language with twice the room, does a head attend usefully past 1,024 pieces,
  and what does a voyage cost in minutes and memory? Read against 9m@v0.0.6. The hole cards are scored in windows
  of the ship''s own context, so its bits a byte are read with up to 2,048 pieces behind each guess and are not
  the 1,024-window reading its control carries: the cards, the stars, the Nevermore and the logic deck read their
  own fixed lengths and are the like-for-like comparison.'
data:
  recipe: lists/ogden-v0.1.4.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.4.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: raw
  opt_in: reads Ogden v0.1.4, the 1m's bigger corpus (v0.1.3's 592 books plus the logic tutor at 5% of the words),
    so the question/answer and premise/conclusion control pieces are exercised
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.4.csv
  symbols:
  - <bos>
  - <eos>
  - <pad>
  - <unk>
  - <sep>
  - <premise>
  - <conclusion>
  - <question>
  - <answer>
  - <end>
model:
  family: gpt
  preset: 9m
  context: 2048
  positions: rope
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.1
    fade: 0.6
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 12
      head: 2
      card: induction
    - layer: 12
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 3
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: 0.0.6
departures:
- 'the post-training SOP: the deck stage read after the four pretraining passes, with the pull off'
- field: content
  why: 'reads Ogden v0.1.4 (the bigger corpus: 592 books plus the logic tutor at 5% of the words) and keeps it raw
    on purpose, so the question/answer and premise/conclusion pieces are exercised'
- field: tokeniser
  why: 'the ten control tokens as single pieces (the marked tokeniser), which SOP v0.0.6''s pieces-2048 does not
    declare: the chat turns need them whole'
- field: context
  why: 'the window at double, kipling:9: 2,048 pieces, the arm''s one change'
seed: 1
