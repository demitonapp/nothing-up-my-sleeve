# ships/specs/fitouts: the hard reasoning leg at 9m (14 November; Justin: "build the stuff next for priority 3";
# "wouldn't we wait for the 9m results and if positive extrapolate that to the 21m and then the 50m"). The 50m
# answered 94% of the old chains at once, so thinking had nothing to fix; on chains of four to six steps with
# look-alike facts the 21m's thinking fell 15 points below its at-once answers (taught only to three steps). Here
# the 9m reasoning leg's recipe with half its lessons hard (backend/scripts/make_reasoning_corpus.py --hard), read
# on 200 of the 600 hard held-out chains. knockout:6 asks a gain above zero on two seeds: this and its -s2 twin.
name: 9m@v0.0.6-fleetmarks-reason-hard
expedition: knockout
goal: 6
ship: 'SOP v0.0.6 at 9m (the reasoning leg, on the fleet''s marks)'
experiment: 'The hard reasoning leg (knockout:6): taught chains of four to six steps among look-alike facts, does the 9m answer better thinking than at once?'
question: 'The reasoning leg at 9m with half its lessons hard, on 9m@v0.0.6-fleetmarks: lists/reasoning-hard-mixed-v1.csv (40,000 lessons, half chains of four to six steps with two to four look-alike facts and the premises out of order, half the original chains; half of all thinking) beside 236 Ogden books, two passes. Read every 100 steps on 200 of the 600 hard held-out chains (lists/reasoning-hard-heldout-v1.jsonl), thinking and at once.'
departures:
- field: content
  why: the reasoning leg reads its lessons, not Ogden
- field: training
  why: 'seeded from 9m@v0.0.6-fleetmarks, the pull off: a leg after pretraining, not a fresh voyage'
- field: tokeniser
  why: 'the seed''s: the fleet''s eleven marks as single pieces'
- field: optim
  why: '0.0003 with 50 steps of warm-up, the conversation leg''s rate (0.001 cost the 9m''s language on the talk pair)'
milestones:
- at: 0.5
  metric: eval/hole-cards-unseen/bpb_mean
  at_most: 2.4
  if_missed: recall
  why: a catastrophe guard, not a target, the conversation leg's own kind
thinking:
  open: <think>
  close: <answer>
  share: 0.5
data:
  recipe: lists/reasoning-hard-mixed-v1.csv
  passes: 2
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: marks-v1
  turns: marks
  opt_in: 'the hard reasoning leg (knockout:6): chains written by code, half of four to six steps among look-alike facts, half thinking and half at once, with Ogden books beside them'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
  symbols:
  - "<bos>"
  - "<eos>"
  - "<question>"
  - "<answer>"
  - "<end>"
  - "<premise>"
  - "<sep>"
  - "<conclusion>"
  - "<think>"
  - "<call>"
  - "<result>"
model:
  family: gpt
  preset: 9m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.0003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 50
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 0.0
    hold: 0.0
    fade: 0.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 12
      head: 2
      card: induction
    - layer: 12
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 3
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 100
  evaluators:
  - ce_bpb
  - reasoning
  options:
    reasoning:
      clean: marks-v1
      limit: 200
      max_new: 200
      heldout: lists/reasoning-hard-heldout-v1.jsonl
checkpoint:
  every_steps: 100
sop: 0.0.6
seed: 1
seeded_from:
  run: 9m@v0.0.6-fleetmarks
  mode: free
