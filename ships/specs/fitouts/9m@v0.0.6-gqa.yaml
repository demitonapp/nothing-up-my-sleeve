# ships/specs/fitouts: the GQA arm at 9m, rewritten 12 November (kipling:6; Justin: "queue the 1m and 9m GQA to
# see what it does there before signing off"). The arm of 9 November read plain Ogden v0.1 with the unmarked
# tokeniser and was stopped before it docked; the 9m that did dock (9m@v0.0.6, 11 November) reads Ogden v0.1.4
# raw with the marked tokeniser, so the old arm had no ship to be read against. This one is 9m@v0.0.6 with ONE
# thing changed: model.kv_heads 2. The master charter's KV heads row waits on it and on 1m@v0.0.6-gqa.
name: 9m@v0.0.6-gqa
expedition: kipling
goal: 6
ship: SOP v0.0.6 at 9m (GQA, 2 KV heads)
experiment: 'The GQA arm at 9m (Kipling, goal 6): 9m@v0.0.6 as it docked, its 6 query heads sharing 2 KV heads.'
question: 'The GQA arm at 9m: 9m@v0.0.6 exactly as it docked (Ogden v0.1.4 kept raw, the marked tokeniser, the four-card
  pull and the comparator riddle) with one thing changed, 6 query heads sharing 2 KV heads instead of each owning
  its own. At the 300k grouping bought no language and cost the mover and the bridge (two seeds). Does it cost the
  cards at 9m too, or is it free where there are more heads to share between? Read against 9m@v0.0.6, the same seed.'
data:
  recipe: lists/ogden-v0.1.4.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.4.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: raw
  opt_in: reads Ogden v0.1.4, the 1m's bigger corpus (v0.1.3's 592 books plus the logic tutor at 5% of the words),
    so the question/answer and premise/conclusion control pieces are exercised
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.4.csv
  symbols:
  - <bos>
  - <eos>
  - <pad>
  - <unk>
  - <sep>
  - <premise>
  - <conclusion>
  - <question>
  - <answer>
  - <end>
model:
  family: gpt
  preset: 9m
  context: 1024
  positions: rope
  kv_heads: 2
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.1
    fade: 0.6
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 12
      head: 2
      card: induction
    - layer: 12
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 3
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: 0.0.6
departures:
- 'the post-training SOP: the deck stage read after the four pretraining passes, with the pull off'
- field: content
  why: 'reads Ogden v0.1.4 (the bigger corpus: 592 books plus the logic tutor at 5% of the words) and keeps it raw
    on purpose, so the question/answer and premise/conclusion pieces are exercised'
- field: tokeniser
  why: 'the ten control tokens as single pieces (the marked tokeniser), which SOP v0.0.6''s pieces-2048 does not
    declare: the chat turns need them whole'
seed: 1
