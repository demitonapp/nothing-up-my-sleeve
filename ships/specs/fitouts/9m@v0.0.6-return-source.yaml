# The source-grade 9m (14 November 2026; knockout:10; Justin: "the build the stuff next for piroirty 2 and 3"). The
# third arm the goal names: the taught leg (9m@v0.0.6-return-taught) learned from 360 official prompts and followed 37.4%
# of the 139 it never saw. This leg is taught the 25 rules from 20,000 fresh prompts written by code
# (backend/scripts/make_ifeval_source_corpus.py: the official registry's own rule wording and parameters on new tasks,
# each response passed by the official checkers), and none of the 541 official prompts is in any book, so its reading
# on all 541 is honest (the ifeval evaluator is on, as the taught leg's could not be). Ogden v0.1.4 books are read
# beside the turns as replay, about as much text as the turns, against the taught leg's lost language (1.70 to 2.53).
name: 9m@v0.0.6-return-source
expedition: knockout
goal: 10
ship: 'SOP v0.0.6 at 9m (the return leg, taught the rules from fresh prompts: the source grade)'
experiment: 'Beat a model ten times its size on IFEval (knockout:10), the source grade: does a 9m taught the 25 rules from
  20,000 fresh prompts, and none of the 541, follow the official prompts better than Falcon-H1-Tiny-90M''s published 66.08?'
question: 'The return leg at 9m, on the v0.0.6 ship, the source grade: one pass over the dialogue shelf, then twelve
  passes over lists/ifeval-source-mix-marked-v1.csv: the taught leg''s 37,244 talk turns, book for book, with 20 of
  20,000 code-written IFEval-style lessons a book in place of its split prompts (each lesson read about 18 times), and
  42 Ogden v0.1.4 books as replay. The pull off, seeded from the finished 9m@v0.0.6. Read on all 541 official prompts
  (ifeval/prompt_strict, greedy, one sample; none is in any book) and on the taught leg''s 139 (answers/prompt_strict),
  with the hole cards for the language it kept.'
departures:
- field: training
  why: 'seeded from 9m@v0.0.6, the pull off: a leg after pretraining, not a fresh voyage'
- field: tokeniser
  why: 'the seed''s: the ten control tokens as single pieces'
- field: content
  why: the return leg reads the dialogue shelf and the source-grade mix (fresh instruction lessons, real exchanges and
    Ogden replay together)
milestones:
- at: 0.4
  metric: eval/hole-cards-unseen/bpb_mean
  at_most: 2.2
  if_missed: warn
  why: 'the language it kept, on the same scale as the rigged leg (the seed reads 1.70 through marks-v1; the rigged pilot
    ended at 4.75). A warning and not a recall: the trip still brings home its held-out IFEval reading'
- at: 0.9
  metric: answers/stopped
  at_least: 0.8
  if_missed: warn
  why: 'it ends its own turn at least 80% of the time on the held-out prompts'
- at: 1.0
  metric: ifeval/prompt_strict
  at_least: 0.6608
  if_missed: warn
  why: 'knockout:10: Falcon-H1-Tiny-90M at its word (TII launch blog, 15 January 2026: 66.08 for its best 90M Instruct;
    53.47 for the Instruct-Curriculum model). Missing it is a result, so the trip is not recalled'
data:
  recipe: lists/ifeval-source-mix-marked-v1.csv
  passes: 12
  stages:
  - name: dialogue
    recipe: lists/dialogue-shelf.csv
    passes: 1
  - name: turns
    recipe: lists/ifeval-source-mix-marked-v1.csv
    passes: 12
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  - lists/ifeval-heldout-v1.csv
  clean: marks-v1
  turns: marks
  opt_in: 'the source-grade return leg (Justin, 14 November): the dialogue shelf, then the talk turns with 20,000 fresh
    IFEval-style lessons written by code from the official rules, each response passed by the official checkers, and Ogden
    books as replay; none of the 541 official prompts is in any book, so the ifeval evaluator reads all 541 honestly'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.4.csv
  symbols:
  - <bos>
  - <eos>
  - <pad>
  - <unk>
  - <sep>
  - <premise>
  - <conclusion>
  - <question>
  - <answer>
  - <end>
model:
  family: gpt
  preset: 9m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 0.0
    hold: 0.0
    fade: 0.0
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 12
      head: 2
      card: induction
    - layer: 12
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 3
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 1000000000
  evaluators:
  - ce_bpb
  - answers
  - ifeval
  options:
    answers:
      format: marks
      clean: marks-v1
      heldout: lists/return-heldout-v1.jsonl
      max_new: 700
    ifeval:
      format: marks
      clean: marks-v1
      limit: 541
      max_new: 700
  light:
    every_steps: 500
    evaluators:
    - ce_bpb
    - answers
checkpoint:
  every_steps: 250
sop: 0.0.6
seed: 1
seeded_from:
  run: 9m@v0.0.6
  mode: free
