# ships/specs/fitouts: the first voyage built to SOP v0.0.1 (8 November): the same corpus, the same phases
# and the same cards as every other size, differing in shape and learning rate alone.
# broken up into phases, the insertion of the metre topics and then normal training on content"): the plain keel's
# own spec (its control, fu-ogden-v0-1@300k-pre-s1/s2, already home) with optim.scaffold (thorp/train.py) and pips.
name: 9m@v0.0.6
ship: 'SOP v0.0.6 at 9m'
experiment: 'The 9m on the bigger Ogden set: the 1m''s v0.1.4 corpus, the marked tokeniser, and the same
  four-card pull, so the 9m is both the next rung and the first size that can rehearse a chat format.'
question: 'SOP v0.0.6 launch, at 9m, on the bigger Ogden set: v0.1.4''s 592 books plus the logic tutor at
  5% of the words and the marked tokeniser, four passes, the four metre cards pinned and the comparator as a
  riddle; full weight to 10%, faded to zero by 60%, then content alone. Can the 9m hold the cards on the bigger
  corpus, and does it learn the question/answer pieces well enough to hold a basic chat? Read against the 1m
  fulldeck and the 300k matched base.'
data:
  recipe: lists/ogden-v0.1.4.csv
  passes: 4
  stages:
  - name: ogden
    recipe: lists/ogden-v0.1.4.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: raw
  opt_in: 'reads Ogden v0.1.4, the 1m''s bigger corpus (v0.1.3''s 592 books plus the logic tutor at 5% of
    the words), so the question/answer and premise/conclusion control pieces are exercised'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.4.csv
  symbols:
  - "<bos>"
  - "<eos>"
  - "<pad>"
  - "<unk>"
  - "<sep>"
  - "<premise>"
  - "<conclusion>"
  - "<question>"
  - "<answer>"
  - "<end>"
model:
  family: gpt
  preset: 9m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.10
    fade: 0.60
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 12
      head: 2
      card: induction
    - layer: 12
      head: 3
      card: duplicate_word
    riddles:
      comparator:
        layer: 3
        head: 2
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: '0.0.6'
departures:
- "the post-training SOP: the deck stage read after the four pretraining passes, with the pull off"
seed: 1
