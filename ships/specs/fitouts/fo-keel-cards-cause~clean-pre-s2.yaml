# specs/fitouts: the four-cards fitout on clean text (unwrap-v1), Justin 2026-11-07 18:50: the raw
# fitout's own spec with data.clean set, so the only difference is the cleaning; the new baseline.
name: fo-keel-cards-cause~clean-pre-s2
ship: 'Fitout: Thorp 300k: the four cards, leaning on cause and effect ~ clean text, pretraining'
experiment: 'Fitout keel-cards-cause: Draw the four necessary cards (previous-word, the Nevermore, the
  mover, the comparator) at 300k, and lean the reading excessively towards cause and effect, the form
  of chaining Qwen3 4B performs on invented words (logic deck: cause +0.94, every other relation near
  zero).'
question: Which cards does the pretraining draw?
data:
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  stages:
  - name: nursery
    recipe: lists/keel-nursery.csv
    passes: 2
  - name: verse
    recipe: lists/stars-verse.csv
    passes: 2
  - name: fiction
    recipe: lists/stars-fiction.csv
    passes: 2
  - name: cause
    recipe: lists/cause-shelf.csv
    passes: 3
  clean: unwrap-v1
  opt_in: 'the clean-text baseline of the four-cards fitout (Justin, 2026-11-07 18:50: "queue them"):
    it must read the fitout''s own shelves, as its raw voyages did, so the only change is the cleaning'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  copy_weight:
    alpha: 3
    kind: induction
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  light:
    every_steps: 100
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
checkpoint:
  every_steps: 1000000
seed: 2
