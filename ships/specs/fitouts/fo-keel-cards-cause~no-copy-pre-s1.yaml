# specs/fitouts: a hand-curated fitout (2026-11-07), compiled by scripts/make_fitout.py.
name: fo-keel-cards-cause~no-copy-pre-s1
ship: 'Fitout: Thorp 300k: the four cards, leaning on cause and effect ~ no-copy, pretraining'
experiment: 'Fitout keel-cards-cause: Draw the four necessary cards (previous-word, the Nevermore, the
  mover, the comparator) at 300k, and lean the reading excessively towards cause and effect, the form
  of chaining Qwen3 4B performs on invented words (logic deck: cause +0.94, every other relation near
  zero).'
question: Which cards does the pretraining draw?
data:
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  stages:
  - name: nursery
    recipe: lists/keel-nursery.csv
    passes: 2
  - name: verse
    recipe: lists/stars-verse.csv
    passes: 2
  - name: fiction
    recipe: lists/stars-fiction.csv
    passes: 2
  - name: cause
    recipe: lists/cause-shelf.csv
    passes: 3
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - soundings
  light:
    every_steps: 100
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
checkpoint:
  every_steps: 1000000
seed: 1
