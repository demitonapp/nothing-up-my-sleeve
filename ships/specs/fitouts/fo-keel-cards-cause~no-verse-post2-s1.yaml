# specs/fitouts: a hand-curated fitout (2026-11-07), compiled by scripts/make_fitout.py.
name: fo-keel-cards-cause~no-verse-post2-s1
ship: 'Fitout: Thorp 300k: the four cards, leaning on cause and effect ~ no-verse, post-training 2 (cause
  again)'
experiment: 'Fitout keel-cards-cause: Draw the four necessary cards (previous-word, the Nevermore, the
  mover, the comparator) at 300k, and lean the reading excessively towards cause and effect, the form
  of chaining Qwen3 4B performs on invented words (logic deck: cause +0.94, every other relation near
  zero).'
question: What does post-training on cause again add? cause and effect, last and heaviest
data:
  recipe: lists/cause-shelf.csv
  passes: 2
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 20
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  copy_weight:
    alpha: 3
    kind: conclusion
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  light:
    every_steps: 100
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
checkpoint:
  every_steps: 1000000
seed: 1
seeded_from:
  run: fo-keel-cards-cause~no-verse-post1-s1
  mode: free
