# specs/fitouts: built in the fitout builder (thorp/fitouts.py).
name: fu-babel-cuneiform-5@300k-pre-s1
ship: 'Fitout: Babel: English + 5% cuneiform @ 300k, pretraining'
experiment: 'Fitout babel-cuneiform-5: Pan on the same English plus cuneiform at 4.99% of the bytes (ETCSL
  and CDLI Sumerian): does the non-English script begin to bias English?'
question: Which cards does the pretraining draw?
data:
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
  opt_in: 'The Babel expedition (Justin, 8 November): cuneiform transliterations are discovery text, not
    an English recipe; Pan is read on English with and without a measured cuneiform share.'
  stages:
  - name: babel
    recipe: lists/babel-cuneiform-5.csv
    passes: 4
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - samples
  - script
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - soundings
  light:
    every_steps: 100
    evaluators:
    - script
    - stars
    - nevermore
    - cards
    - logic
checkpoint:
  every_steps: 1000000
seed: 1
