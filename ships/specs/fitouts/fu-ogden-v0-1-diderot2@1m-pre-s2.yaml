# the four positions at the 1m, seed 2 (DECISIONS.md): built by scripts/make_position_fitouts.py --seed 2
name: fu-ogden-v0-1-diderot2@1m-pre-s2
ship: 'Fitout: Ogden v0.1 + Diderot''s slice 2% @ 1m, pretraining'
experiment: 'Fitout ogden-v0-1-diderot2: Ogden v0.1 with 2% of the reading Diderot''s slice: the generalised
  knowledge (the control) position at the 1m'
question: Does a 1m that reads Diderot's slice at 2% of its reading beat the others on its own position's
  items (and the maths book, Plato's and Francis's items)?
data:
  recipe: lists/composed/ogden-v0-1-diderot2-1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
  opt_in: 'Diderot''s slice: a seeded draw of library books outside the two stores, equal by kind and
    matched in words to the other positions'' slices, approved by Justin (2026-11-08: "Approve the chapters";
    "Yes, 2%")'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 1m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - maths
  - plato
  - francis
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
    - maths
    - plato
    - francis
checkpoint:
  every_steps: 640
seed: 2
