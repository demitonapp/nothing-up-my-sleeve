# the four positions at the 1m (DECISIONS.md): built by scripts/make_position_fitouts.py
name: fu-ogden-v0-1-plato2@1m-pre-s1
ship: 'Fitout: Ogden v0.1 + Plato''s primer 2% @ 1m, pretraining'
experiment: 'Fitout ogden-v0-1-plato2: Ogden v0.1 with 2% of the reading Plato''s primer: the metaphysics
  position at the 1m'
question: Does a 1m that reads Plato's primer at 2% of its reading beat the others on its own position's
  items (and the maths book, Plato's and Francis's items)?
data:
  recipe: lists/composed/ogden-v0-1-plato2-1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
  opt_in: 'Plato''s primer: Thorp''s own lessons in kinds, qualities, sameness and cause, in Ogden''s
    words, local books outside the two stores, approved by Justin (2026-11-08: "Approve the chapters";
    "Yes, 2%")'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 1m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - maths
  - plato
  - francis
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
    - maths
    - plato
    - francis
checkpoint:
  every_steps: 640
seed: 1
