# ships/specs/fitouts: Ogden v0.1 at 21m (Justin, 2026-11-07 21:45: 'make an ogden thorp model at 21m and jump it to the top of the queue').
# The Ogden 9m's own spec with the class (21m: 8 layers, 320 wide) and the class's learning rate and warm-up changed.
name: fu-ogden-v0-1@21m-pre-s1
ship: 'Fitout: Ogden v0.1 @ 21m, pretraining'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each
  size?'
question: 'Which cards and stars does the 21m form on Ogden v0.1, and when (by tokens read)? (Justin,
  21:45: "see what we find at 21m")'
fitout:
  key: ogden-v0-1
  variation: null
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 21m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.0008
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 300
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
checkpoint:
  every_steps: 640
seed: 1
