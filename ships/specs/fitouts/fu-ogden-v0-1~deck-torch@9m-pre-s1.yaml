# ships/specs/fitouts: the parity run (2026-11-08): fu-ogden-v0-1~deck@9m-pre-s1 again on the torch backend, on a GPU hired from Vast.ai.
name: fu-ogden-v0-1~deck-torch@9m-pre-s1
ship: 'Fitout: Ogden v0.1 @ 9m ~ deck-torch (the parity run), fu-ogden-v0-1~deck@9m-pre-s1 on an NVIDIA GPU'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: 'The parity run: does leg 0, the full deck 9m (MLX: bpb 1.550, all ten metre cards and the comparator held, the Bridge played from step 821 to ~3,500) come home the same on the torch backend on CUDA, within the seed spread
  fixed in DECISIONS.md? The gate before any 50m sails on a hired GPU.'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 9m
  context: 1024
  positions: rope
  backend: torch
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.1
    fade: 0.6
    floor: 0.2
    sample:
      windows: 8
      length: 512
    heads:
    - layer: 0
      head: 0
      card: sink
    - layer: 0
      head: 1
      card: delimiter
    - layer: 0
      head: 2
      card: number_spotter
    - layer: 0
      head: 3
      card: order_word
    - layer: 1
      head: 0
      card: previous_word
    - layer: 1
      head: 1
      card: duplicate_word
    - layer: 1
      head: 2
      card: rare_word
    - layer: 1
      head: 3
      card: premise_marker
    - layer: 2
      head: 0
      card: words_back
    - layer: 3
      head: 0
      card: induction
    - layer: 3
      head: 1
      card: induction
    riddles:
      comparator:
        layer: 3
        head: 2
        items: 16
        pool: 2048
      bridge:
        layer: 4
        items: 16
        pool: 2048
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
seed: 1
