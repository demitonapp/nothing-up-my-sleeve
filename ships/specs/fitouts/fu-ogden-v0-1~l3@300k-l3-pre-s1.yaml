# ships/specs/fitouts: Ogden v0.1, the keel with a third layer (Justin, 20:40: 'both 3-layer pairs'): the two-layer
# keel's own spec with the model (and, for ~l3-copy, the induction tack of the four-cards fitout) changed.
name: fu-ogden-v0-1~l3@300k-l3-pre-s1
ship: 'Fitout: Ogden v0.1 @ 300k-l3 ~ l3, pretraining'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each
  size?'
question: Does a third layer let the keel trade previous-word and induction in for the Nevermore on Ogden
  v0.1?
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k-l3
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
checkpoint:
  every_steps: 640
seed: 1
