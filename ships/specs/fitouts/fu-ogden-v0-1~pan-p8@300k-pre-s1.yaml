name: fu-ogden-v0-1~pan-p8@300k-pre-s1
ship: 'Fitout: Ogden v0.1 @ 300k ~ pan-p8 (Pan''s bigram search), eight passes, not four'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: 'Pan''s bigram search, round 1 (8 November): the plain Pan with eight passes, not four, every other setting
  the same. Does its top guess find the right keyed word more often (shapes/keyed_top1, the plain Pan 0.208 and
  0.200, the bigram table 0.303)?'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 8
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
checkpoint:
  every_steps: 640
seed: 1
