# ships/specs/fitouts: Pan with the four metre cards it has room for (8 November, Justin: "all the metre
# cards from 50m being pushed into Pan early"). The plain Pan control is fu-ogden-v0-1@300k-pre-s1/s2.
# broken up into phases, the insertion of the metre topics and then normal training on content"): the plain keel's
# own spec (its control, fu-ogden-v0-1@300k-pre-s1/s2, already home) with optim.scaffold (thorp/train.py) and pips.
name: fu-ogden-v0-1~pan-scaffold4@300k-pre-s1
ship: 'Fitout: Ogden v0.1 @ 300k ~ pan-scaffold4, the four metre cards by the rule'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: 'Pan''s four metre cards pinned at full weight to 20% of the voyage and faded out by 60%: previous-word and
  duplicate-word in layer 0, induction and the sink in layer 1. Does a card Pan has never lit (duplicate-word 0.00,
  sink 0.05) take at all, and does it stay played by heart after the pull is gone?'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.20
    fade: 0.60
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: duplicate_word
    - layer: 1
      head: 0
      card: induction
    - layer: 1
      head: 1
      card: sink
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
seed: 1
