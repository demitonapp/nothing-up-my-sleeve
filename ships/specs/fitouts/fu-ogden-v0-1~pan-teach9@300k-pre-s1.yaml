name: fu-ogden-v0-1~pan-teach9@300k-pre-s1
ship: 'Fitout: Ogden v0.1 @ 300k ~ pan-teach9 (Pan''s bigram search), the 21m as its teacher (alpha 0.9, temperature
  2)'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: 'Pan''s bigram search, round 1 (8 November): the plain Pan with the 21m as its teacher (alpha 0.9, temperature
  2), every other setting the same. Does its top guess find the right keyed word more often (shapes/keyed_top1,
  the plain Pan 0.208 and 0.200, the bigram table 0.303)?'
fitout:
  key: ogden-v0-1
  variation: pan-teach9
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  teacher:
    run: fu-ogden-v0-1@21m-pre-s1
    alpha: 0.9
    temperature: 2.0
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
checkpoint:
  every_steps: 640
seed: 1
