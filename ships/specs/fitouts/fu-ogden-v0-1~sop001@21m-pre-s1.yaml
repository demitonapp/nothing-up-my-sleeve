# ships/specs/fitouts: the first voyage built to SOP v0.0.1 (8 November): the same corpus, the same phases
# and the same cards as every other size, differing in shape and learning rate alone.
# broken up into phases, the insertion of the metre topics and then normal training on content"): the plain keel's
# own spec (its control, fu-ogden-v0-1@300k-pre-s1/s2, already home) with optim.scaffold (thorp/train.py) and pips.
name: fu-ogden-v0-1~sop001@21m-pre-s1
ship: 'Fitout: Ogden v0.1 @ 21m ~ SOP v0.0.1, the standard launch'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: 'SOP v0.0.1 at 21m: the same corpus, tokeniser, passes, phases and cards as the 300k, 1m and 9m
  launches, with the comparator in the middle layer (layer 4); full weight to 10% of the voyage,
  faded to zero by 60%, content alone after. Which of the five cards is held by heart at this size?'
fitout:
  key: ogden-v0-1
  variation: sop-v0.0.1
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 21m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.0008
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 300
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 1.0
    hold: 0.10
    fade: 0.60
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 1
      head: 0
      card: induction
    - layer: 1
      head: 1
      card: duplicate_word
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: '0.0.1'
seed: 1
