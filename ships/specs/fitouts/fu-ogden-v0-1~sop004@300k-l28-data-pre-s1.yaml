# ships/specs/fitouts: the first voyage built to SOP v0.0.1 (8 November): the same corpus, the same phases
# and the same cards as every other size, differing in shape and learning rate alone.
# broken up into phases, the insertion of the metre topics and then normal training on content"): the plain keel's
# own spec (its control, fu-ogden-v0-1@300k-pre-s1/s2, already home) with optim.scaffold (thorp/train.py) and pips.
name: fu-ogden-v0-1~sop004@300k-l28-data-pre-s1
ship: 'Fitout: Ogden v0.1 @ 300k-l28 ~ the deck stage, data-taught'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: 'The depth test, at the smallest class: the same corpus, tokeniser, passes and four cards as the 300k, but twenty-eight
  layers at 24 wide (269k parameters against 295k) and the copy cards pinned at layer 19 -- 68% depth, as Qwen3 4B
  resolves them at 61% -- rather than at layer 1 of 2. Does the depth carry chaining, or does the card read the same
  wherever it sits? The 300k held 1 of 4 cards and chained 0.034.'
data:
  opt_in: "the card stage (9 November): passages written so one card carries each, before Ogden -- the data-taught against pin-taught comparison"
  stages:
  - name: the deck
    recipe: lists/card-stage-deck-v2.csv
    passes: 2
  - name: ogden
    recipe: lists/ogden-v0.1.csv
    passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 300k-l28
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  scaffold:
    weight: 0.0
    hold: 0.10
    fade: 0.60
    heads:
    - layer: 0
      head: 0
      card: previous_word
    - layer: 0
      head: 1
      card: delimiter
    - layer: 19
      head: 0
      card: induction
    - layer: 19
      head: 1
      card: duplicate_word
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
sop: '0.0.4'
departures:
- "the data stage: a card-linked corpus (the deck, 3% of the tokens) before Ogden; data-taught -- the cards are read out of the deck stage with the pull at zero"
departures:
- the copy cards pinned at layer 2 (67% depth) rather than layer 1, to test whether the depth is what carries chaining
seed: 1
