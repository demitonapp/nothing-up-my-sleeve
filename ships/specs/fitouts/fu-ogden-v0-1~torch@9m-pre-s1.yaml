# ships/specs/fitouts: the parity run (2026-11-08): fu-ogden-v0-1@9m-pre-s1 again on the torch backend, on a GPU hired from Vast.ai.
name: fu-ogden-v0-1~torch@9m-pre-s1
ship: 'Fitout: Ogden v0.1 @ 9m ~ torch (the parity run), fu-ogden-v0-1@9m-pre-s1 on an NVIDIA GPU'
experiment: 'Fitout ogden-v0-1: one fixed Ogden corpus for every class; what cards and stars form at each size?'
question: 'The parity run: does the plain 9m (MLX: bpb 1.501, copy gain 0.47, 3 cards) come home the same on the torch backend on CUDA, within the seed spread
  fixed in DECISIONS.md? The gate before any 50m sails on a hired GPU.'
data:
  recipe: lists/ogden-v0.1.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 9m
  context: 1024
  positions: rope
  backend: torch
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
seed: 1
