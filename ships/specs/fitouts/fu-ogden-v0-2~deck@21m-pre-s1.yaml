# ships/specs/fitouts: the 21m before the first 50m (2026-11-08, Justin 12:30): The Smallest Bridge's leg 1b recipe on
# the 21m, the copy tack, and the release stage (the pull off for the last 10%). Written 13:20, before leg 1b docks.
name: fu-ogden-v0-2~deck@21m-pre-s1
ship: 'Fitout: Ogden v0.2 @ 21m ~ deck (the 21m before the 50m), the full deck staged, the copy tack, released'
experiment: 'Fitout ogden-v0-2: v0.1''s rule over the whole library, and the logic tutor''s passages at 7.5%'
question: 'Does the 21m with the full deck staged on Ogden v0.2 (leg 1b''s recipe and layout, the Bridge composed
  in all four relations), the copy tack (induction, alpha 3) and a release stage (the pull off from 90% of the
  voyage, so every card is read by heart) beat Qwen3 4B on at least 12 of the deck''s 15 cards, missing only cards
  size should close? Justin''s gate before the first 50m.'
data:
  recipe: lists/ogden-v0.2.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  clean: unwrap-v2
  opt_in: 'Ogden v0.2 reads books beyond the two stores, approved by Justin (2026-11-08 08:10): the library''s books
    at v0.1''s Ogden-ness bar, the Bible struck, and the logic tutor''s template passages'
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/ogden-v0.1.csv
model:
  family: gpt
  preset: 21m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.0008
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 300
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  copy_weight:
    alpha: 3
    kind: induction
  scaffold:
    weight: 1.0
    hold: 0.1
    fade: 0.6
    floor: 0.2
    release: 0.9
    sample:
      windows: 8
      length: 512
    heads:
    - layer: 0
      head: 0
      card: sink
    - layer: 0
      head: 1
      card: delimiter
    - layer: 0
      head: 2
      card: number_spotter
    - layer: 0
      head: 3
      card: order_word
    - layer: 1
      head: 0
      card: previous_word
    - layer: 1
      head: 1
      card: duplicate_word
    - layer: 1
      head: 2
      card: rare_word
    - layer: 1
      head: 3
      card: premise_marker
    - layer: 2
      head: 0
      card: words_back
      from: 0.05
    - layer: 3
      head: 0
      card: induction
      from: 0.05
    - layer: 3
      head: 1
      card: induction
      from: 0.05
    riddles:
      comparator:
        layer: 3
        head: 2
        items: 16
        pool: 2048
        from: 0.05
      bridge:
        layer: 4
        items: 16
        pool: 2048
        from: 0.05
        kinds: all
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 640
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - logic40
  - stars
  - nevermore
  - cards
  - shapes
  - pips
  - soundings
  light:
    every_steps: 64
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
    - shapes
    - pips
checkpoint:
  every_steps: 640
seed: 1
