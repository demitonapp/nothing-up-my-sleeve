# specs/fitouts: built in the fitout builder (thorp/fitouts.py).
name: fu-trigram-engine-period-random@300k-pre-s2
ship: 'Fitout: Trigram engine (period, random books) @ 300k, pretraining'
experiment: 'Fitout trigram-engine-period-random: The control for the trigram engine: the same shelves,
  amounts and passes, books chosen at random instead of by repetition'
question: Which cards does the pretraining draw?
data:
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  stages:
  - name: repetition engine
    recipe: lists/fitouts/trigram-engine-period-random/1-repetition-engine-s2.csv
    passes: 4
  - name: repetition engine II
    recipe: lists/fitouts/trigram-engine-period-random/2-repetition-engine-ii-s2.csv
    passes: 4
  - name: causal skeleton
    recipe: lists/fitouts/trigram-engine-period-random/3-causal-skeleton-s2.csv
    passes: 3
  - name: narrative
    recipe: lists/fitouts/trigram-engine-period-random/4-narrative-s2.csv
    passes: 2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  copy_weight:
    alpha: 3
    kind: induction
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - soundings
  light:
    every_steps: 100
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
checkpoint:
  every_steps: 1000000
seed: 2
