# specs/fitouts: built in the fitout builder (thorp/fitouts.py).
name: fu-trigram-engine-period@300k-pre-s1
ship: 'Fitout: Trigram engine (period) @ 300k, pretraining'
experiment: 'Fitout trigram-engine-period: The most in-window trigram repetition for a 300k, to grow an
  induction head: the repetition engine first, the causal skeleton next, narrative last'
question: Which cards does the pretraining draw?
data:
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  stages:
  - name: repetition engine
    recipe: lists/fitouts/trigram-engine-period/1-repetition-engine-s1.csv
    passes: 4
  - name: repetition engine II
    recipe: lists/fitouts/trigram-engine-period/2-repetition-engine-ii-s1.csv
    passes: 4
  - name: causal skeleton
    recipe: lists/fitouts/trigram-engine-period/3-causal-skeleton-s1.csv
    passes: 3
  - name: narrative
    recipe: lists/fitouts/trigram-engine-period/4-narrative-s1.csv
    passes: 2
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 300k
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  copy_weight:
    alpha: 3
    kind: induction
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  - soundings
  light:
    every_steps: 100
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
checkpoint:
  every_steps: 1000000
seed: 1
