# ships/specs/investigations: the knockout's seventh goal, our half of the AI2 ARC audit (12 November).
# The nine outside readings are in s4.outside_readings; none of our ships had been read on the test at all.
kind: investigation
name: arc-ai2-300k
expedition: knockout
ship: "Knockout: 300k@v0.0.6-pins on AI2 ARC, Easy and Challenge"
question: >-
  Where does our best 300k (the ten-pin arm, the best keel) stand on the one test the band under 1B is ranked by? AI2 ARC-Easy (2,376 questions) and
  ARC-Challenge (1,172), read as the nine outside models were: zero-shot, the option's own text as the
  continuation, the lowest mean loss a piece the bet. SmolLM2-360M reads 64.8 on Easy and chance is 25. The
  reading is written at the ship's last checkpoint (arc_easy/accuracy, arc_challenge/accuracy) with its
  artifact; it trains nothing and changes no other reading of the run.
subject: "300k@v0.0.6-pins"
run:
  - -m
  - thorp
  - eval
  - "{subject}"
  - --evaluators
  - arc_ai2
# about how long it takes (12 November): the 300k's reads of 12 November took 23 to 24 seconds a sailing, plus loading
estimate: 2m
timeout: 45m
readings: []
