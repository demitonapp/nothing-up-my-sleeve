# ships/specs/investigations: Arc de Triomphe, the first reading (11 November, Justin: "Let's start with Qwen3 4B
# on the Arc tests then. We'll need to test with both reasoning and no reasoning").
kind: investigation
name: arc-qwen3-4b
expedition: knockout
ship: "Knockout: Qwen3 4B on ARC-AGI-2, reasoning off and on"
question: >-
  What does reasoning buy a 4B on ARC-AGI-2? The same model, the same 120 public evaluation tasks, read once
  with its thinking switched off and once with it on. Qwen3.8 27B goes from 1.5 to 42.4 between the two; the 4B
  is the model whose every head is already on the census, so whatever it gains here can be traced. The morning
  pilot's zero was read with the thinking on and cut at 256 pieces, before any grid was written.
subject: mlx-community/Qwen3-4B-4bit
run:
  - backend/scripts/score_arc.py
  - "{subject}"
  - --limit
  - "0"            # the whole public evaluation set, so the reading is not a pilot
  - --thinking
  - both           # off, then on, in one load
  - --max-thinking
  - "4096"
  - --max-output
  - "1024"         # the longest answer grid is 935 characters
  - --max-pairs
  - "6"            # every example pair a task has (the scorer's default shows three)
  - --context
  - "16384"
# about how long it takes (12 November, from its own log): thinking off read the 120 tasks in 45 minutes; with the
# thinking on a task takes about 226 seconds (66 tasks in 14,911 s), so the 120 take about 7.5 hours more
estimate: 500m
timeout: 16h
readings:
  - "arc-{subject}"
  - "arc-{subject}@thinking"
