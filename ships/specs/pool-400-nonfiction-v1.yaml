# specs/pool-400-nonfiction-v1.yaml: the non-fiction half of the pool, matched in bytes to the fiction half: the kind test
name: pool-400-nonfiction-v1
ship: "Only Things That Happened"
data:
  recipe: lists/pool-400-nonfiction.csv
  passes: 2
  order: shuffled
  refuse: [lists/hole-cards.csv]
tokeniser:
  kind: spm-bpe
  vocab: 16384
  byte_fallback: true
  train_on: recipe
model:
  family: gpt
  preset: 9m
  context: 1024
optim:
  name: adamw
  lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets: [lists/hole-cards.csv]
  every_steps: 250
  evaluators: [ce_bpb, samples, probes]
checkpoint:
  every_steps: 500
seed: 1
