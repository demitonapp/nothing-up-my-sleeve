# specs/proxy-nonfiction-v1.yaml: the 1m proxy's calibration (2026-11-07), written by scripts/make_proxy_specs.py.
name: proxy-nonfiction-v1
ship: Little Mayflower
experiment: '1m proxy calibration: does the 1m model rank shelves the way 9m does?'
data:
  recipe: lists/pool-400-nonfiction.csv
  passes: 2
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
tokeniser:
  kind: spm-bpe
  vocab: 4096
  byte_fallback: true
  train_on: recipe
model:
  family: gpt
  preset: 1m
  context: 1024
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  - lists/hole-cards-v2.csv
  every_steps: 250
  evaluators:
  - ce_bpb
  - nevermore
  - bpb_split
  - probes
  - soundings
checkpoint:
  every_steps: 1000000
seed: 1
