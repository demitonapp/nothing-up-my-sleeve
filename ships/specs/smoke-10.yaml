# specs/smoke-10.yaml: section 4 with passes 1, the first 10 recipe rows, eval every 50
name: smoke-10
ship: Dinghy   # ten books, one pass: the boat you test the harness in
data:
  recipe: lists/smoke-10.csv
  passes: 1
  order: shuffled
  refuse: [lists/hole-cards.csv]
tokeniser:
  kind: spm-bpe
  vocab: 16384
  byte_fallback: true
  train_on: recipe
model:
  family: gpt
  preset: 9m
  context: 1024
optim:
  name: adamw
  lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets: [lists/hole-cards.csv]
  every_steps: 50
  evaluators: [ce_bpb, samples]
checkpoint:
  every_steps: 500
seed: 1
