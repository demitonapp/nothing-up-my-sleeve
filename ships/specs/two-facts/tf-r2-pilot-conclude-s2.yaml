# specs/two-facts: The two-fact problem, the baseline (2026-11-07), written by scripts/make_two_facts.py.
name: tf-r2-pilot-conclude-s2
ship: 'Two facts, round 2: the pilot with conclude'
experiment: 'The two-fact problem: how close does each class come to chaining two facts?'
question: Does conclude light the Nevermore and the mover, and lift chaining, in the pilot?
data:
  recipe: lists/stars-fiction.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
tokeniser:
  kind: spm-bpe
  vocab: 4096
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 1m
  context: 1024
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  copy_weight:
    alpha: 3
    kind: conclusion
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - bpb_split
  - discovery
  - logic
  - cards
  - stars
  - nevermore
  - successor
  - soundings
  light:
    every_steps: 200
    evaluators:
    - discovery
    - logic
    - nevermore
    - cards
checkpoint:
  every_steps: 1000000
seed: 2
# S5 policy 'fitout' (2026-11-07 18:10): the named fitout this voyage is a variation of
