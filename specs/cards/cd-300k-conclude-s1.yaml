# specs/cards: the card census (2026-11-07), written by scripts/make_card_census.py.
name: cd-300k-conclude-s1
ship: 'Cards: the 300k with conclude'
experiment: 'The card census: which of the necessary cards can this class draw at all?'
question: Does conclude light previous-word, the Nevermore, the mover or the comparator at 300k?
data:
  recipe: lists/stars-fiction.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
tokeniser:
  kind: spm-bpe
  vocab: 2048
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 300k
  context: 1024
optim:
  name: adamw
  lr: 0.003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  copy_weight:
    alpha: 3
    kind: conclusion
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  light:
    every_steps: 100
    evaluators:
    - stars
    - nevermore
    - cards
checkpoint:
  every_steps: 1000000
seed: 1
