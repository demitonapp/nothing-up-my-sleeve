# specs/content-about-v1-seed2.yaml: the content experiment (2026-11-06), books written about those three ages by later authors; seed 2.
# Pre-registered in DECISIONS.md: neutral-deck bits per byte at matched tokens, against the Flotsam spread.
name: content-about-v1-seed2
ship: Merely Describing Greatness, Rolled Again
experiment: 'content: does what is on the shelf change how well the model bets on unseen books?'
question: 'Does writing about the golden ages teach as much as the ages'' own writing, and more or less
  than random books? (seed 2: the same question, its error bar)'
data:
  recipe: lists/content-about.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/truths.csv
  - lists/neutral.csv
  - lists/held-greek.csv
  - lists/held-islamic.csv
  - lists/held-renaissance.csv
tokeniser:
  kind: spm-bpe
  vocab: 16384
  byte_fallback: true
  train_on: recipe
model:
  family: gpt
  preset: 9m
  context: 1024
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 8192
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/neutral.csv
  - lists/held-greek.csv
  - lists/held-islamic.csv
  - lists/held-renaissance.csv
  every_steps: 400
  evaluators:
  - ce_bpb
  - nevermore
  - bpb_split
  - laws
  - samples
  - probes
  - curiosity
  - soundings
  - successor
  - discovery
checkpoint:
  every_steps: 500
seed: 2
