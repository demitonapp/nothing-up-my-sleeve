# specs/fitouts: a hand-curated fitout (2026-11-07), compiled by scripts/make_fitout.py.
name: fo-pilot-cards-cause~no-cause-pre-pre-s1
ship: 'Fitout: Thorp 1m: the four cards, leaning on cause and effect ~ no-cause-pre, pretraining'
experiment: 'Fitout pilot-cards-cause: The keel''s fitout one class up (the same stages, shelves and tacks;
  the pilot''s vocabulary and learning rate), so the two classes'' card censuses compare stage for stage.'
question: Which cards does the pretraining draw?
data:
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
  stages:
  - name: nursery
    recipe: lists/keel-nursery.csv
    passes: 2
  - name: verse
    recipe: lists/stars-verse.csv
    passes: 2
  - name: fiction
    recipe: lists/stars-fiction.csv
    passes: 2
tokeniser:
  kind: spm-bpe
  vocab: 4096
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 1m
  context: 1024
  positions: rope
optim:
  name: adamw
  lr: 0.002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 100
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
  copy_weight:
    alpha: 3
    kind: induction
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - discovery
  - logic
  - stars
  - nevermore
  - cards
  light:
    every_steps: 100
    evaluators:
    - stars
    - nevermore
    - cards
    - logic
checkpoint:
  every_steps: 1000000
seed: 1
# S5 policy 'fitout' (2026-11-07 18:10): the named fitout this voyage is a variation of
fitout:
  key: pilot-cards-cause
  variation: no-cause-pre
