# specs/spell-mantra-v1-seed2.yaml: the 9m speller curriculum (2026-11-06), written by scripts/make_curriculum_specs.py.
name: spell-mantra-v1-seed2
ship: Lines Written a Hundred Times, Rolled Again
experiment: '9m curriculum: does teaching spelling first help the 9m model spell?'
question: 'Does repeating the rules of spelling a hundred times first, like a mantra, help the 9m model
  spell? (seed 2: the error bar)'
data:
  recipe: lists/pool-400-spellers.csv
  passes: 2
  order: curriculum
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  first: lists/spelling-rules.csv
  first_repeats: 100
tokeniser:
  kind: spm-bpe
  vocab: 16384
  byte_fallback: true
  train_on: recipe
model:
  family: gpt
  preset: 9m
  context: 1024
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 200
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  every_steps: 250
  evaluators:
  - ce_bpb
  - bpb_split
  - laws
  - samples
  - probes
checkpoint:
  every_steps: 500
seed: 2
