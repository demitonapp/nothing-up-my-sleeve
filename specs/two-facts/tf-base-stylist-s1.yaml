# specs/two-facts: The two-fact problem, the baseline (2026-11-07), written by scripts/make_two_facts.py.
name: tf-base-stylist-s1
ship: 'Two facts: the stylist''s baseline'
experiment: 'The two-fact problem: how close does each class come to chaining two facts?'
question: With what is known today, what climb and chaining lift does the stylist reach?
data:
  recipe: lists/stars-fiction.csv
  passes: 4
  order: shuffled
  refuse:
  - lists/hole-cards.csv
  - lists/hole-cards-v2.csv
  - lists/hole-cards-unseen.csv
tokeniser:
  kind: spm-bpe
  vocab: 4096
  byte_fallback: true
  train_on: lists/loop-pool.csv
model:
  family: gpt
  preset: 21m
  context: 1024
optim:
  name: adamw
  lr: 0.0008
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 300
  schedule: cosine
  min_lr_ratio: 0.1
  batch_tokens: 32768
  grad_clip: 1.0
  precision: bf16
eval:
  sets:
  - lists/hole-cards-unseen.csv
  every_steps: 500
  evaluators:
  - ce_bpb
  - bpb_split
  - discovery
  - stars
  - nevermore
  - successor
  - logic
  - cards
  light:
    every_steps: 250
    evaluators:
    - discovery
    - logic
checkpoint:
  every_steps: 1000
seed: 1
# S5 policy 'fitout' (2026-11-07 18:10): the named fitout this voyage is a variation of
fitout:
  key: pilot-cards-cause
  variation: tf-base-stylist
